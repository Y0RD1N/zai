name: Build and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    if: github.repository == 'Y0RD1N/zai' && github.actor_id == '173011369' && github.triggering_actor == 'Y0RD1N'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm test
      - name: Desktop smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:desktop
        env:
          ZAI_TEST_NO_SANDBOX: '1'
      - name: Desktop smoke test (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Validate desktop packaging
        run: npx electron-builder --dir --publish never
