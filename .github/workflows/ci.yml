name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm test
      - name: Desktop smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:desktop
        env:
          ZAI_TEST_NO_SANDBOX: '1'
      - name: Desktop smoke test (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Validate desktop packaging
        run: npx electron-builder --dir --publish never
